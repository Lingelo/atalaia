name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Les incidents de la protection civile évoluent à la minute ; les satellites
  # ne repassent que toutes les quelques heures. C'est donc le premier qui fixe
  # la cadence. Un cron GitHub se déclenche au mieux toutes les 5 minutes et se
  # trouve souvent retardé : compter sur une fraîcheur de 10 à 30 minutes.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Vérifier le typage
        run: npm run lint

      # NASA FIRMS ne renvoie aucun en-tête CORS, et api.fogos.pt n'en renvoie
      # pas non plus sur les GET : un site statique ne peut interroger ni l'un
      # ni l'autre. On récupère donc les deux ici, où la politique d'origine ne
      # s'applique pas. Les trois services espagnols, eux, accepteraient un
      # appel direct depuis le navigateur ; ils sont récupérés ici quand même,
      # pour que tout le jeu porte une seule et même date de production.
      - name: Précalculer les données temps réel
        run: npm run build:data

      # NOTE — l'onglet Historique et son agrégation ont été retirés. Le workflow
      # mettait en cache `history.json` à la journée, parce que le script
      # parcourait l'archive portugaise page par page : api.fogos.pt, derrière
      # Cloudflare, n'accepte qu'environ cinq requêtes par fenêtre de quinze
      # secondes, ce qui rendait l'agrégation longue de plusieurs minutes et
      # exposait l'adresse au bannissement. Tout cela disparaît avec l'onglet :
      # la publication ne dépend plus que des données temps réel ci-dessus.

      - name: Construire le site
        run: npm run build
        env:
          VITE_BASE: /atalaia/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
