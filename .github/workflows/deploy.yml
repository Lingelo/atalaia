name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Les incidents de la protection civile évoluent à la minute ; les satellites
  # ne repassent que toutes les quelques heures. C'est donc le premier qui fixe
  # la cadence. Le déclenchement reste souvent retardé de quelques minutes :
  # compter sur une fraîcheur de 10 à 20 minutes plutôt que sur la valeur
  # nominale.
  #
  # POURQUOI 10 ET NON 5, que GitHub accepterait. Un passage émet 8 requêtes
  # amont : fogos.pt (1), les deux services ArcGIS (1 chacun) et la Junta de
  # Castilla y León (5, qui pagine). À 5 minutes on atteindrait 2 300 requêtes
  # par jour ; à 10 on reste à 1 150, pour une fraîcheur déjà meilleure de
  # moitié qu'auparavant. Ces services rendent un service public et gratuit :
  # la marge se prend de notre côté, pas du leur.
  #
  # ⚠️ Cette cadence ne vaut QUE pour les incidents. Le jeu FIRMS est mis en
  # cache à l'heure (voir plus bas) : le télécharger à chaque passage ferait
  # descendre plusieurs gigaoctets de CSV par jour depuis la NASA, pour des
  # orbites espacées de plusieurs heures. Le cache DIVISE cette charge par
  # quatre par rapport au rythme précédent.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Vérifier le typage
        run: npm run lint

      # NASA FIRMS ne renvoie aucun en-tête CORS, et api.fogos.pt n'en renvoie
      # pas non plus sur les GET : un site statique ne peut interroger ni l'un
      # ni l'autre. On récupère donc les deux ici, où la politique d'origine ne
      # s'applique pas. Les trois services espagnols, eux, accepteraient un
      # appel direct depuis le navigateur ; ils sont récupérés ici quand même,
      # pour que tout le jeu porte une seule et même date de production.
      #
      # ⚠️ LES DEUX JEUX SONT PRODUITS SÉPARÉMENT, et ce n'est pas cosmétique.
      # Ils tenaient dans un seul `npm run build:data`, soit
      # `build-firms && build-incidents` : le `&&` faisait qu'une panne réseau
      # chez la NASA empêchait de récupérer les incidents, puis de publier le
      # site. L'accessoire — une couche satellite optionnelle, éteinte par
      # défaut — bloquait l'essentiel : les sinistres de la protection civile,
      # qui sont la raison d'être de cette carte.

      # CACHE SATELLITE À L'HEURE, et c'est ce qui rend le cron de 5 minutes
      # soutenable. La clé porte l'heure courante : au premier passage de
      # l'heure elle manque, le CSV est téléchargé ; les onze suivants
      # restaurent le fichier en une seconde. On descend ainsi 24 jeux par jour
      # au lieu de 288, pour une donnée dont les passages satellite sont espacés
      # de plusieurs heures — rien n'est perdu en fraîcheur réelle.
      #
      # `restore-keys` assure en plus le repli sur le dernier jeu réussi, quelle
      # que soit son heure : `public/data/` étant ignoré par git, un runner neuf
      # n'en a AUCUN, et sans ce filet un échec FIRMS laisserait la couche vide
      # plutôt que légèrement datée. Les détections portent leur horodatage et
      # pâlissent en vieillissant : resservir un jeu d'une heure se voit.
      - name: Heure courante (clé de cache)
        id: hour
        run: echo "value=$(date -u +%Y-%m-%dT%H)" >> "$GITHUB_OUTPUT"

      - name: Restaurer les détections satellite
        id: firms-cache
        uses: actions/cache/restore@v4
        with:
          path: public/data/firms.json
          key: firms-${{ steps.hour.outputs.value }}
          restore-keys: firms-

      # `continue-on-error` : une panne de la NASA dégrade la couche satellite,
      # elle ne doit pas retenir la publication. L'interface sait déjà signaler
      # une couche indisponible.
      - name: Précalculer les détections satellite (NASA FIRMS)
        id: firms
        if: steps.firms-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: npm run build:firms

      - name: Conserver les détections satellite
        if: steps.firms.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: public/data/firms.json
          key: firms-${{ steps.hour.outputs.value }}

      # Les incidents, eux, RESTENT bloquants : sans eux la carte n'a plus de
      # sujet, et publier une page vide vaudrait moins que garder la précédente.
      - name: Précalculer les incidents (protection civile)
        run: npm run build:incidents

      - name: Construire le site
        run: npm run build
        env:
          VITE_BASE: /atalaia/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
