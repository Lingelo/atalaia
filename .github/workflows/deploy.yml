name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Les satellites VIIRS repassent toutes les quelques heures : republier plus
  # souvent ne ferait que retélécharger les mêmes CSV.
  # Les incidents de la protection civile évoluent à la minute ; les satellites
  # ne repassent que toutes les quelques heures. C'est donc le premier qui fixe
  # la cadence. Un cron GitHub se déclenche au mieux toutes les 5 minutes et se
  # trouve souvent retardé : compter sur une fraîcheur de 10 à 30 minutes.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Vérifier le typage
        run: npm run lint

      # NASA FIRMS ne renvoie aucun en-tête CORS : le navigateur ne peut pas
      # l'interroger depuis un site statique. On précalcule donc les foyers ici.
      # NASA FIRMS ne renvoie aucun en-tête CORS, et api.fogos.pt n'en renvoie
      # pas non plus sur les GET : un site statique ne peut interroger ni l'un
      # ni l'autre. On récupère donc les deux ici, où la politique d'origine ne
      # s'applique pas.
      - name: Précalculer les données
        run: npm run build:data

      - name: Construire le site
        run: npm run build
        env:
          VITE_BASE: /atalaia/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
