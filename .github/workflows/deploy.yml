name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Les incidents de la protection civile évoluent à la minute ; les satellites
  # ne repassent que toutes les quelques heures. C'est donc le premier qui fixe
  # la cadence. Un cron GitHub se déclenche au mieux toutes les 5 minutes et se
  # trouve souvent retardé : compter sur une fraîcheur de 10 à 30 minutes.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Vérifier le typage
        run: npm run lint

      # NASA FIRMS ne renvoie aucun en-tête CORS, et api.fogos.pt n'en renvoie
      # pas non plus sur les GET : un site statique ne peut interroger ni l'un
      # ni l'autre. On récupère donc les deux ici, où la politique d'origine ne
      # s'applique pas. Les trois services espagnols, eux, accepteraient un
      # appel direct depuis le navigateur ; ils sont récupérés ici quand même,
      # pour que tout le jeu porte une seule et même date de production.
      #
      # ⚠️ LES DEUX JEUX SONT PRODUITS SÉPARÉMENT, et ce n'est pas cosmétique.
      # Ils tenaient dans un seul `npm run build:data`, soit
      # `build-firms && build-incidents` : le `&&` faisait qu'une panne réseau
      # chez la NASA empêchait de récupérer les incidents, puis de publier le
      # site. L'accessoire — une couche satellite optionnelle, éteinte par
      # défaut — bloquait l'essentiel : les sinistres de la protection civile,
      # qui sont la raison d'être de cette carte.

      # Repli sur le dernier jeu satellite réussi. `public/data/` étant ignoré
      # par git, un runner neuf n'en a AUCUN : sans ce cache, un échec FIRMS
      # laisse la couche entièrement vide plutôt que légèrement datée. Les
      # détections portent leur horodatage et la carte les grise en vieillissant,
      # donc resservir un jeu de quelques heures se voit à l'écran.
      - name: Restaurer les détections satellite
        uses: actions/cache/restore@v4
        with:
          path: public/data/firms.json
          key: firms-${{ github.run_id }}
          restore-keys: firms-

      # `continue-on-error` : une panne de la NASA dégrade la couche satellite,
      # elle ne doit pas retenir la publication. L'interface sait déjà signaler
      # une couche indisponible.
      - name: Précalculer les détections satellite (NASA FIRMS)
        id: firms
        continue-on-error: true
        run: npm run build:firms

      - name: Conserver les détections satellite
        if: steps.firms.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: public/data/firms.json
          key: firms-${{ github.run_id }}

      # Les incidents, eux, RESTENT bloquants : sans eux la carte n'a plus de
      # sujet, et publier une page vide vaudrait moins que garder la précédente.
      - name: Précalculer les incidents (protection civile)
        run: npm run build:incidents

      - name: Construire le site
        run: npm run build
        env:
          VITE_BASE: /atalaia/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
